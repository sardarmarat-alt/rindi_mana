.link{color:var(--wine);font-weight:600;cursor:pointer;background:none;border:0;padding:0;font-size:.95rem;font-family:var(--sans);text-decoration:underline}
.specs{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:22px}
.spec{padding:14px 16px}

.spec span{font-size:.85rem;color:var(--muted)}
.slot{aspect-ratio:4/3;border:2px dashed rgba(255,255,255,.4);border-radius:20px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.9rem;padding:12px}

.mini svg{width:70px;height:96px;display:block;margin:0 auto 8px}
form{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.f{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}
.f.chk{flex-direction:row;align-items:center;gap:10px}.f.chk input{width:auto}
label{font-weight:500;font-size:.95rem}
input,select,textarea{font:inherit;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);width:100%}

#ok{display:none;background:var(--leaf);color:#fff;padding:18px;border-radius:4px;margin-top:16px}
footer{background:var(--deep);color:#cbbdb6;padding:40px 24px;text-align:center;font-size:.9rem}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none;filter:none}.bl{transform:none}}
